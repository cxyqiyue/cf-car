<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <div id="app">正在加载...</div>

    <script>
    (function () {
        var WORKER_URL = 'https://car.qyfy.kdns.fr';
        // 去掉 /cf-car 前缀，保留 query
        var path = location.pathname.replace(/^\/cf-car/, '') || '/';
        var target = WORKER_URL + path + location.search;

        // ===== 检测微信环境 =====
        var ua = navigator.userAgent.toLowerCase();
        var isWeixin = ua.indexOf('micromessenger') !== -1;
        // 微信里 SW 不可靠，直接跳转到 Worker 域名
        if (isWeixin) {
            console.log('[page] 检测到微信环境，直接跳转到 Worker');
            location.replace(target);
            return;
        }

        // ===== 其他浏览器：继续用 Service Worker 代理 =====
        if (!('serviceWorker' in navigator)) {
            console.warn('[page] 不支持 SW，直接跳转到 Worker');
            location.replace(target);
            return;
        }

        var refreshing = false;

        navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (refreshing) return;
            refreshing = true;
            window.location.reload();
        });

        console.log('[page] 开始注册 sw.js ...');

        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
                console.log('[page] SW 注册成功, scope =', reg.scope);
                return navigator.serviceWorker.ready;
            })
            .then(function (reg) {
                var hasController = !!navigator.serviceWorker.controller;
                console.log('[page] SW 已就绪, 是否已被控制:', hasController);

                if (!sessionStorage.getItem('sw_reloaded_v1')) {
                    sessionStorage.setItem('sw_reloaded_v1', '1');
                    refreshing = true;
                    window.location.reload();
                } else if (!hasController) {
                    // 如果两次都没接管成功，直接降级跳转到 Worker
                    console.warn('[page] SW 接管失败，降级跳转到 Worker');
                    location.replace(target);
                } else {
                    console.log('[page] SW 已完全接管');
                }
            })
            .catch(function (err) {
                console.error('[page] SW 注册失败，降级跳转:', err);
                location.replace(target);
            });
    })();
    </script>
</body>
</html>
