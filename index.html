<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <div id="app">正在加载 Worker 内容...</div>

    <script>
    (function () {
        if (!('serviceWorker' in navigator)) {
            console.error('[page] 浏览器不支持 Service Worker');
            return;
        }

        var refreshing = false;

        // SW 一旦接管，就刷新页面
        navigator.serviceWorker.addEventListener('controllerchange', function () {
            console.log('[page] controllerchange 触发');
            if (refreshing) return;
            refreshing = true;
            console.log('[page] 正在刷新以应用 SW...');
            window.location.reload();
        });

        console.log('[page] 开始注册 SW...');

        // updateViaCache: 'none' 强制每次都拉最新 sw.js，避免浏览器缓存旧版本
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
                console.log('[page] SW 注册成功, scope =', reg.scope);
                // 等待 SW 变为 active
                return navigator.serviceWorker.ready;
            })
            .then(function (reg) {
                console.log('[page] SW 已就绪, active 状态:', reg.active && reg.active.state);
                var hasController = !!navigator.serviceWorker.controller;
                console.log('[page] 当前是否已被 SW 控制:', hasController);

                // 无论是否已被控制，只要这次是首次加载，都刷新一次确保接管生效
                // 通过 sessionStorage 判断，避免无限刷新
                if (!sessionStorage.getItem('sw_reloaded')) {
                    sessionStorage.setItem('sw_reloaded', '1');
                    console.log('[page] 首次加载，强制刷新让 SW 接管...');
                    refreshing = true;
                    window.location.reload();
                } else if (!hasController) {
                    console.log('[page] 仍未被控制，再刷新一次...');
                    refreshing = true;
                    window.location.reload();
                } else {
                    console.log('[page] SW 已完全接管本次会话');
                }
            })
            .catch(function (err) {
                console.error('[page] SW 注册失败:', err);
            });
    })();
    </script>
</body>
</html>
